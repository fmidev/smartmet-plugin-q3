<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<!--
- q3 test suite
-
- NOTE: To be used via a server, to allow cross domain ajax access.
-       Safari can run this directly from 'file://' URL.
-->

<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en-US">
<head profile="http://gmpg.org/xfn/11">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <script type="text/javascript" src="tools/jquery.min.js"></script>

    <!-- Our scripts -->
    <script type="text/javascript" src="site.js"></script>
    <script type="text/javascript" src="differ.js"></script>

    <link rel="stylesheet" href="reset.css" type="text/css" />
    <link rel="stylesheet" href="site.css" type="text/css" />
    
    <title>q3 autotests</title>
</head>
<body>

<!-- div just for the sake of visual effect -->
<div id="frame">

<!--
- Only Safari allows cross domain ajax fetches from local filesystem ('file://').
- Point others to use the page via a server
-->
<div id="use_via_server" style="display:none;">
    Cross domain Ajax will most likely NOT work with this browser directly.
    <br />
    Load this page from <a href="http://crash.fmi.fi/q3-testsuite">http://crash.fmi.fi/q3-testsuite</a>
    instead.
</div>

<div id="go_all">Run all tests</div>     <!-- positioned by CSS -->

<h1>q3 autotests</h1>

<div id="config">

    <div>    
        <label for="q3_url">Q3 server 1:</label>
        <input type="text" val="" id="q3_url" size="30" />
        <span id="q3_version"></span>

        <!-- Presets for selecting the right q3 server -->
        <select id="q3_presets">
            <option x_url="crash.fmi.fi:8080/q3">crash.fmi.fi Brainstorm plugin</option>
            <option x_url="smartmet.fmi.fi/q3">smartmet.fmi.fi Brainstorm plugin</option>
            <option x_url="crash.fmi.fi:8999/q3">crash.fmi.fi development plugin</option>
        </select>
    </div>
    <br />
    <div>
        <label for="q2_url">Q3 server 2:</label>
        <input type="text" val="" id="q2_url" size="30" />
    </div>
</div>

<!-- Tests to be shown
-
- Note: Use of a custom attribute 'test' allows us to get two flies at once. We specify
-       the test to run and mark the particular div's that will show test contents.
-->

<div test="jira_119"></div>
<div test="jira_109"></div>
<div test="jira_105"></div>

<div test="test1"></div>
<div test="test2"></div>
<div test="test3"></div>
<div test="test4"></div>
<div test="test5"></div>
<div test="test6"></div>
<div test="test7"></div>
<div test="test8"></div>
<!--
<div test="test9"></div>
-->
<div test="test10"></div>
<div test="test11"></div>
<div test="test12"></div>

<div test="random_balls"></div>
<div test="mask"></div>
<div test="fonts"></div>
<div test="synop_font"></div>
<div test="temp_balls"></div>
<div test="temp_smooth"></div>
<div test="wind_vectors"></div>
<div test="contour"></div>
<div test="contour2"></div>
<div test="fills"></div>

<div test="cccrp1"></div>
<!--
<div test="cccrp2"></div>
-->
<div test="cccrp3"></div>
<div test="cccrp4"></div>
<!--
<div test="cccrp5"></div>
-->

<div test="uv_wind"></div>
<div test="time_interpolation"></div>

</div>  <!-- '#frame' -->
</body>
</html>
