    from local disk):

    1. Setting Firefox 3.5 "about:config" preferences to allow cross-domain fetches
       Did not seem to work.
       
    2. Studied JSONP which is suggested as a solution to these issues on the net.
       However, it does not apply to cases where the file is opened from disk (JSONP
       always has to do with an intermediate server, which does not exist in this case).

-- configure here \n\
local param= T \n\
local limit= 0 \n\
\n\
local r,err= HIR{ hybrid=true, params={param,Z,P} } \n\
assert(r,err) \n\
\n\
-- Iterate levels from down to up \n\
-- Store height and pressure when >= 'limit' (last will remain) \n\
\n\
local m_Z= matrix()  -- heights collected; originally all 'nan' \n\
local m_P= matrix()  -- pressures collected \n\
local m_v= matrix()  -- value at such positions (not needed) \n\
\n\
for g in grids_by_level(r) do \n\
  for pos,v in points(g[param]) do \n\
    if v>=limit then \n\
      m_Z[pos]= g.Z[pos] \n\
      m_P[pos]= g.P[pos] \n\
      m_v[pos]= v \n\
    end \n\
  end \n\
end \n\
return m_Z, m_P, m_v \n\

/*---=== Helper functions ===---*/

// JavaScript does not automatically escape '+' and some others in input strings
// (see <http://en.wikipedia.org/wiki/Percent-encoding>)
//
function escape_plus(str)
{
    // Tested that these are all that need conversion (Safari 4.0)
    //
    return str.replace(/[\n"#\&\+%]/g, 
            function(c) { 
                var x= c.charCodeAt(0).toString(16);
                if (x.length==1) x= "0"+x;
                return "%"+x;
            } );
}

// Make a single 8-bit char into hex string ("00".."ff")
// 
function hex8(d) {
    var s= d.toString(16);    // "0".."ffffffff"

    if (d>60000) {  // gives i.e. "fffd" (take only last two)
        return s.substring(2);
    } else {
        return (d<16) ? "0"+s : s;
    }
}

// Callbacks when URL output arrives (with status==4)

function pane_loaded( response_text, ms, url, is_q2, binary )
{
    var $pane= $(is_q2 ? "#q2_pane":"#q3_pane");
    var $ms= $(is_q2 ? "#q2_ms":"#q3_ms");

    if (binary) {
        // Convert binary block to hex
        //
        var i=0;
        var n= response_text.length;
        var s= ""+n+" bytes:\n";

        // Note: q2 binary format is:
        //          7 int32's 
        //          x*y int16's or int32's
        //
        //      We don't try to resolve this inner structure. Just print out the bytes
        //      (we could show 16-bit compounds, too).
        //      Spaces between the bytes highlight the fact that they are not built to 32-bit
        //      entities (i.e. 1 -> "01 00 00 00", not "01000000").
        //
        while( i<n ) {
            for( var j=0; j<16; j++ ) {
                if (i<n) {
                    // NOTE: '.charCodeAt()' does Unicode conversions. We wouldn't want that.
                    //      '& 0xff' from a web component claiming to give binary reading is
                    //      a wrong way, right? Seems we cannot get to the raw byte data carried
                    //      in any way? We'll mark unknown values simply as '??'.   --AKa 10-Dec-10
                    //
                    var b= response_text.charCodeAt(i);
                    var ss;

                    if (b>127) {    // only 0..127 can be trusted not to have changed due to Unicode interpreting
                        ss= "??";
                    } else {
                        ss= hex8(b);
                    }
                    s += ss + (j==7 ? "-": j==15 ? "\n":" ");
                } else {
                    s += "\n"; break;
                }
                i++;
            }
        }
        $pane.html( "<pre>"+s+"</pre>" );

    } else {
        // Note:
        //      Safari 4.0 fails to place long response texts (at least the "Origintimes" test)
        //      within a <pre> block. We need to provide such data as raw text, instead.
        //
        //      <10000 was too short for some Climate guide output.     --AKa 28-May-10
        //
        if (response_text.length < 100000) {
            $pane.html( "<pre>"+response_text+"</pre>" );
        } else {
            $pane.text( response_text );
        }
    }

    $ms.prepend( ms+" <font color=\"gray\">" ).append("</font>");

    var same= false;

/*** DISABLED ***

        // If the first lines start with "xx,yy;" (of the same sizes), modify them

        var matrix_re= /^(\d+,\d+);(.+)$/;

            // [0]: whole match (not used)
            // [1]: first catch (size)
            // [2]: tail ("v1,v2,...")

        if (this_match_arr && other_match_arr && (this_match_arr[1]===other_match_arr[1])) {
            //
            // Two matrices, same sizes.
            // Replace ".000...0" with "" and "32700" with "".
            //
            this_comp= this_match_arr[2];    // the tail
            other_comp= other_match_arr[2];

            var trim_zeroes_re= /\.0+(?=,|$)/g;

            //assert_eq( "500,1.0,2.07,123.000".replace( trim_zeroes_re, "" ), "500,1,2.07,123" );

            this_comp= this_comp.replace( trim_zeroes_re, "" );
            other_comp= other_comp.replace( trim_zeroes_re, "" );

            // Make Q2 ",32700," into ",," (and also at end of string)
            // Prepend strings with "," to make regexping easier (or even possible?)            
            //
            var comma_and_missing_re= /,32700(?=,|$)/g;
            
            if (q_this === q2) {
                this_comp= (","+this_comp).replace(comma_and_missing_re,",").substring(1);
            } else {
                other_comp= (","+other_comp).replace(comma_and_missing_re,",").substring(1);
            }
        }
        
        same= (this_comp === other_comp) ? +1:-1;
    }

    status_pane.innerHTML= (same==1) ? "<font color=green>First lines same.</font>" :
                           (same==-1) ? "<font color=red>NOT SAME!</font>" : "";
***/
}


// Callbacks when image loaded (stop the timer)
//
function image_loaded( t0 )
{
    var t_diff= (new Date()).getTime() - t0;

    var $pane= $("#q3_pane");
    var $ms= $("#q3_ms");

    $ms.prepend( t_diff+" <font color=\"gray\">" ).append("</font>");

    // Remove the "Loading..." text
    //
    $("#q3_pane i").remove();
}


//
function refresh( which )
{
    if (!which) {
        refresh(2); refresh(3);
        return;
    }
    var is_q2= (which==2);

    var base= $(is_q2 ? "#q2_server":"#q3_server").val();

    var $url= $(is_q2 ? "#q2_url":"#q3_url");       // the URL for this particular search (for user to click or copy)
    var $pane= $(is_q2 ? "#q2_pane":"#q3_pane");

    var macro= is_q2 ? $("#q2_macro").val() : editor.getCode();

    // Parameters for selecting the data (and limiting output precision) are the same
    //
    var tail= is_q2 ? (
        "&validTime="+ $("#validtime").val() +
        "&projection="+ $("#projection").val() +
        "&gridSize="+ $("#gridsize").val()
    ) : (
        "&validtime="+ $("#validtime").val() +
        "&projection="+ $("#projection").val() +
        "&gridsize="+ $("#gridsize").val()
    );

    var binary= $("#binary_q2")[0].checked;
    if (binary) {
        tail += "&output=bin";
    }
    
    var decimals= $("#decimals").val();
    if (!isNaN(decimals)) {
        tail += is_q2 ? ("&maxDecimals="+ decimals)
                      : ("&decimals="+ decimals);
    }

    var url= base+ (is_q2 ? (
        "?requestType=macroParam&macroParamStr="
    ) : (
        "?code="
    )) +escape_plus(macro)+tail;
    
    $url.html( "<A HREF=\""+url+"\">"+(is_q2 ? "Q2":"Q3")+" url</A>" );
    $pane.html( "<i>Loading...</i>" );

    var t0= (new Date()).getTime();

    // If we're fetching an image, it's enough to change the picture source.
    //
    var img_coming= $("#show_as_image")[0].checked;

    if (img_coming) {
        // Let's add a random part to the URL, to make the picture redraw.
        //
        url += "?" + Math.random();
        
        $pane.html( "<img src=\""+url+"\" onLoad=\"image_loaded("+t0+")\" />"+
                    "<i>Loading...</i>" );
    } else {
        if (JSONP) {
            url += "&callback=?";
        }

        // NB. '$.ajax()' returns the 'XMLHttpRequest' object, in case we need to keep
        //      it around for cancellation of ongoing request.
        //
        $.ajax({
            url: url,
            cache: false,
            dataType: JSONP ? "jsonp" : "text",
            success: function(data, status) {
                // status: "success" (even for syntax errors); maybe comes from the status code?
                //
                var t_diff= (new Date()).getTime() - t0;
                pane_loaded( data, t_diff, url, is_q2, binary );
            },
            error: function( req, status, thrown ) {
                // status: "error"
                // thrown: "undefined"
                // req.status: 404 or 0
                //    .statusText: "OK" or ""
                //    .responseText: "Service Not Found " or ""
                //
                if (req.responseText=="") {
                    $pane.html( "<i>server down? (no response)</i>" );
                } else {
                    // i.e. 
    /*
    Runtime error: lua/track_proxy.lua:96: source/NA_Param.cpp:788: Bad param name: Txxx
    stack traceback:
        [C]: in function 'track'
        lua/track_proxy.lua:96: in function 
        code:1: in main chunk
        [C]: ?
    */
                    $pane.html( "<pre><i>"+(req.responseText)+"</i></pre>" );
                }
            }
        });
    }
}
