#
# Q3 Plugin Configuration
#
# log:          "stderr" | "syslog user|daemon|local0..local7"
# package_path: Lua addon search path (like LUA_PATH)
# package_cpath:Lua binary addon search path (like LUA_CPATH)
# killtime:     max time for a script to run
# refresh:      time between data refreshes ('false' for none)
# rootdir:      path prepended to relative file masks
# relative_uv:  true if wind U/V components are grid-relative (default: false)
#
# Tracks are defined as named blocks. Each track lists one or more file masks.
# Within a track, 'runs' sets how often new model runs appear (affects -1,-2,...
# negative origintime indexing).
#

log = syslog local2

package_path = /usr/share/luajit-2.1/?.lua
package_cpath = /usr/lib64/?.so

killtime = 20sec
refresh = 3min
rootdir = /smartmet/

#---
# Health check reports sent periodically to the logging service.
#
# healthcheck(x.x)= [cpu] [mem] [swap] [<path>] [...]
#
# x.x:  time between the logs ([Xh][YYmin][ZZsec])
# cpu:  track cpu usage
# mem:  memory usage
# swap: swap usage
# path: track usage of the mount for the particular folder
#
# There may be multiple healthcheck lines, to perform different checks with
# different intervals.
#
healthcheck(3min)= *
healthcheck(60min)= / /smartmet/data /smartmet/brainstorm /smartmet/archive

#
# relative_uv indicates whether wind U and V components are relative to the grid.
# Setting can be given globally and at track and filemask level.
#
# default is false.
#
relative_uv = true

