// SmartMet Server reactor configuration for Q3 plugin tests

accesslogdir = "/tmp";

port            = 80;

slowpool:
{
  maxthreads = 15;
  maxrequeuesize = 1000;
};

fastpool:
{
  maxthreads = 15;
  maxrequeuesize = 1000;
};

lazylinking = false;

defaultlogging = false;

debug           = true;
verbose         = false;

engines:
{
};

plugins:
{
	q3:
	{
		configfile      = "q3plugin.conf";
		libfile         = "../../q3.so";
	};
};
