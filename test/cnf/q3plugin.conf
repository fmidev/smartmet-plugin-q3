#
# Q3 Plugin Test Configuration
#
log = stderr
killtime = 20sec
cache = /tmp/.q3_test_cache
refresh = 1min

HIR {
    runs= 6h
    { /usr/share/smartmet/test/data/hirlam/*_hirlam_eurooppa_pinta_cropped.sqd }
}

EC {
    runs= 12h
    { /usr/share/smartmet/test/data/ecpinta/*_ecmwf_eurooppa_pinta.sqd }
}

ECPP {
    runs= 12h
    { /usr/share/smartmet/test/data/ecpainepinta/*_ecmwf_skandinavia_painepinta240h.sqd }
}

HARM {
    runs= 6h
    { /usr/share/smartmet/test/data/harmonie/*_harmonie_hybrid-cropped.sqd }
}
